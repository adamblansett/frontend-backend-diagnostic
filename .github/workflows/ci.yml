name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vitest 5 requires Node ^22.12.0 || ^24.0.0
        node-version: [ 22.x, 24.x ]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Healthy fixture must scan clean
        run: node dist/cli/index.js scan fixtures/healthy-app
      - name: Broken fixture must be flagged (expected exit code 1)
        run: |
          set +e
          node dist/cli/index.js scan fixtures/broken-app --format sarif --output scan-results.sarif
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 for broken-app, got $code"
            exit 1
          fi
          node -e "const r=JSON.parse(require('fs').readFileSync('scan-results.sarif','utf8')); if(r.version!=='2.1.0'||!r.runs[0].results.length){process.exit(1)}"
